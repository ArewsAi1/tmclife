name: Link Ogden Deck Depot Restore CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-odd-restore-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ogden-deck-depot-preview
          fetch-depth: 0
      - name: Link compatibility stylesheet into every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('odd-preview')
          marker = '<link rel="stylesheet" href="/weebly-restore.css">'
          changed = 0
          for p in root.rglob('*.html'):
              text = p.read_text(errors='ignore')
              if marker in text:
                  continue
              if '</head>' in text:
                  text = text.replace('</head>', marker + '\n</head>', 1)
                  p.write_text(text)
                  changed += 1
          print(f'Updated {changed} HTML files')
          if changed == 0:
              print('No changes needed')
          PY
      - name: Commit and push production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odd-preview
          git commit -m "Link Weebly restoration CSS across all pages" || exit 0
          git push origin HEAD:ogden-deck-depot-preview
