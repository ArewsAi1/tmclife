name: Rebuild Ogden Deck Depot Assets

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ogden-deck-depot-preview
          fetch-depth: 0
      - name: Download and extract untouched export
        run: |
          python -m pip install --quiet gdown pillow
          gdown 1YECNBb_lVa3a5vgN--o5PnWoQzLz40rb -O /tmp/odd-weebly.zip
          rm -rf /tmp/odd-extract /tmp/odd-preserve
          mkdir -p /tmp/odd-extract /tmp/odd-preserve
          unzip -q /tmp/odd-weebly.zip -d /tmp/odd-extract
          src="$(find /tmp/odd-extract -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          for item in functions _headers _redirects; do [ -e "odd-preview/$item" ] && cp -a "odd-preview/$item" "/tmp/odd-preserve/$item" || true; done
          rm -rf odd-preview && mkdir odd-preview
          cp -a "$src/." odd-preview/
          for item in functions _headers _redirects; do [ -e "/tmp/odd-preserve/$item" ] && cp -a "/tmp/odd-preserve/$item" "odd-preview/$item" || true; done
      - name: Rebuild image tree and validate
        run: python .github/scripts/rebuild_odd_assets.py
      - name: Restore HTTPS and header compatibility
        run: |
          find odd-preview -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 | xargs -0 sed -i -e 's|http://cdn11\.editmysite\.com|https://cdn11.editmysite.com|g' -e 's|http://cdn2\.editmysite\.com|https://cdn2.editmysite.com|g' -e 's|http://cdn1\.editmysite\.com|https://cdn1.editmysite.com|g'
          printf '\n.birdseye-header,body.header-overlay-on .birdseye-header,body.affix .birdseye-header{background:#fff!important;color:#000!important}.birdseye-header a,.birdseye-header .wsite-menu-item,.birdseye-header #wsite-title{color:#000!important}\n' >> odd-preview/files/main_style.css
      - name: Commit validated rebuild
        run: |
          test -f odd-preview/index.html
          test ! -s /tmp/odd_missing_assets.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A odd-preview
          git commit -m "Rebuild complete Weebly image tree and rewrite all references" || exit 0
          git push origin HEAD:ogden-deck-depot-preview
