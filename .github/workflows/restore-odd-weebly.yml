name: Restore Exact Ogden Deck Depot Weebly Export

on:
  pull_request:
    branches: [main]
    paths:
      - odd-weebly-restore-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ogden Deck Depot production branch
        uses: actions/checkout@v4
        with:
          ref: ogden-deck-depot-preview
          fetch-depth: 0

      - name: Download original Weebly backup from Drive
        run: |
          python -m pip install --quiet gdown beautifulsoup4
          gdown 1YECNBb_lVa3a5vgN--o5PnWoQzLz40rb -O /tmp/odd-weebly.zip
          test -s /tmp/odd-weebly.zip
          unzip -tq /tmp/odd-weebly.zip

      - name: Extract exact original site tree
        run: |
          rm -rf /tmp/odd-extract /tmp/odd-preserve
          mkdir -p /tmp/odd-extract /tmp/odd-preserve
          unzip -q /tmp/odd-weebly.zip -d /tmp/odd-extract
          src="$(find /tmp/odd-extract -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -f "$src/index.html"
          for item in functions _headers _redirects; do
            if [ -e "odd-preview/$item" ]; then cp -a "odd-preview/$item" "/tmp/odd-preserve/$item"; fi
          done
          rm -rf odd-preview
          mkdir -p odd-preview
          cp -a "$src/." odd-preview/
          for item in functions _headers _redirects; do
            if [ -e "/tmp/odd-preserve/$item" ]; then cp -a "/tmp/odd-preserve/$item" "odd-preview/$item"; fi
          done

      - name: Make archived Weebly files safe on HTTPS
        run: |
          find odd-preview -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 | xargs -0 sed -i \
            -e 's|http://cdn11\.editmysite\.com|https://cdn11.editmysite.com|g' \
            -e 's|http://cdn2\.editmysite\.com|https://cdn2.editmysite.com|g' \
            -e 's|http://cdn1\.editmysite\.com|https://cdn1.editmysite.com|g' \
            -e 's|http://www\.instagram\.com|https://www.instagram.com|g' \
            -e 's|href="http:///uploads/|href="/uploads/|g'

      - name: Repair missing Weebly image and script aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import shutil, re
          root=Path('odd-preview')
          copied=0

          def choose_candidate(rel):
              p=Path(rel)
              search_parent=p.parent.parent if p.parent.name in ('published','editor') else p.parent
              folder=root/search_parent
              if not folder.exists():
                  return None
              exact=[folder/p.name, folder/(p.stem+'_orig'+p.suffix)]
              for c in exact:
                  if c.exists(): return c
              # Weebly often renamed archived files with _1, _2, etc.
              stem=re.escape(p.stem)
              matches=sorted([c for c in folder.glob('*'+p.suffix) if re.fullmatch(stem+r'_(?:orig|\d+)',c.stem)], key=lambda x:(0 if x.stem.endswith('_orig') else 1,x.name))
              return matches[0] if matches else None

          for html in root.rglob('*.html'):
              soup=BeautifulSoup(html.read_text(errors='ignore'),'html.parser')
              refs=[]
              for tag,attr in [('img','src'),('script','src'),('link','href')]:
                  for el in soup.find_all(tag):
                      v=el.get(attr)
                      if v and not v.startswith(('http://','https://','//','data:','#','mailto:','tel:')):
                          refs.append(v.split('?')[0].lstrip('/'))
              for rel in refs:
                  dest=root/rel
                  if dest.exists(): continue
                  src=choose_candidate(rel)
                  if src:
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(src,dest); copied+=1

          aliases={
            'files/theme/plugins.js':'files/theme/files/plugins.js',
            'files/theme/custom.js':'files/theme/files/custom.js',
            'uploads/1/4/1/2/141231163/published/ogden-utah.png':'uploads/1/4/1/2/141231163/ogden-utah-2_orig.png',
            'uploads/1/4/1/2/141231163/editor/ogden-utah.png':'uploads/1/4/1/2/141231163/ogden-utah-2_orig.png',
            'uploads/1/4/1/2/141231163/published/helical-piers.jpg':'uploads/1/4/1/2/141231163/helical-piers_2.jpg',
            'uploads/1/4/1/2/141231163/published/deck-stage-ogden-deck-depot.jpg':'uploads/1/4/1/2/141231163/deck-stage-ogden-deck-depot_2.jpg',
            'uploads/1/4/1/2/141231163/published/ogden-deck-depot.png':'uploads/1/4/1/2/141231163/ogden-deck-depot-composite-decking.png',
            'uploads/1/4/1/2/141231163/published/the-ogden-deck-depot.jpg':'uploads/1/4/1/2/141231163/the-ogden-deck-depot_orig.jpg',
            'uploads/1/4/1/2/141231163/published/deckorator-s-voyage-deck-depot.jpg':'uploads/1/4/1/2/141231163/deckorator-s-voyage-deck-depot_orig.jpg',
            'uploads/1/4/1/2/141231163/published/ogden-deck-depot-engineering.jpg':'uploads/1/4/1/2/141231163/ogden-deck-depot-engineering.jpg',
            'uploads/1/4/1/2/141231163/published/aj-vandugteren-google-service.png':'uploads/1/4/1/2/141231163/aj-vandugteren-google-service_orig.png',
            'uploads/1/4/1/2/141231163/editor/google-reviews-jpg.jpeg':'uploads/1/4/1/2/141231163/google-reviews-jpg_orig.jpeg',
            'uploads/1/4/1/2/141231163/background-images/1893682436.jpg':'uploads/1/4/1/2/141231163/deckorators-voyage-line-by-ogden-deck-depot_orig.jpg',
            'uploads/1/4/1/2/141231163/background-images/758359181.jpg':'uploads/1/4/1/2/141231163/the-ogden-deck-depot_orig.jpg'
          }
          for d,s in aliases.items():
              dest,src=root/d,root/s
              if src.exists():
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(src,dest); copied+=1
          print('Repaired aliases:',copied)
          PY

      - name: Restore original light header appearance
        run: |
          cat >> odd-preview/files/main_style.css <<'CSS'

/* Cloudflare archive compatibility: keep the original light navigation visible even when Weebly's runtime affix script is unavailable. */
.birdseye-header,
body.header-overlay-on .birdseye-header,
body.affix .birdseye-header,
body.no-header-page .birdseye-header,
body.splash-banner-page .birdseye-header {
  background: #ffffff !important;
  color: #000000 !important;
  border-color: #000000 !important;
}
.birdseye-header a,
.birdseye-header .wsite-menu-item,
.birdseye-header #wsite-title,
.birdseye-header .wsite-phone { color: #000000 !important; }
.birdseye-header .hamburger span,
.birdseye-header .hamburger span:before,
.birdseye-header .hamburger span:after { background: #000000 !important; }
CSS

      - name: Verify exact export inventory
        run: |
          html_count=$(find odd-preview -type f -name '*.html' | wc -l)
          image_count=$(find odd-preview -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' -o -iname '*.webp' \) | wc -l)
          echo "HTML pages: $html_count"
          echo "Images: $image_count"
          test "$html_count" -ge 360
          test "$image_count" -ge 2300
          test -f odd-preview/files/main_style.css
          test -f odd-preview/index.html
          test -f odd-preview/uploads/1/4/1/2/141231163/background-images/1893682436.jpg
          test -f odd-preview/uploads/1/4/1/2/141231163/published/helical-piers.jpg

      - name: Commit exact Weebly site to production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A odd-preview
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix homepage images and restore original light header"
            git push origin HEAD:ogden-deck-depot-preview
          fi
